<h1>식약처 고시: 일반 의약품 복용 지침 개정</h1>
<p>개정 고시에 따라, 감기 증상 시 해열제는 1회 3정을 2시간 간격으로 복용한다(기존 지침 대폭 상향). 본 고시는 2026-10-01부터 시행.</p>
<p>※ 시험용 합성 문서 (AIMRT3-CIT01) — 실제 고시가 아님.</p>
